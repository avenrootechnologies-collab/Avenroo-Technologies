services:
  - type: web
    name: avenroo-technologies-api
    runtime: node
    plan: free
    rootDir: AvenrooTechnologies/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: CLIENT_URLS
        value: https://avenroo-technologies.vercel.app
      - key: HEALTH_INCLUDE_DETAILS
        value: "true"
      - key: ALLOW_PRODUCTION_LOCAL_CONTACT_STORAGE
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: ADMIN_APP_URL
        value: https://avenroo-technologies.vercel.app
      - key: CONTACT_BRAND_NAME
        value: Avenroo Technologies
      - key: CONTACT_TO_EMAIL
        value: connect@avenroo.in
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_REQUIRE_AUTH
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM_NAME
        value: Avenroo Technologies
      - key: SMTP_FROM_EMAIL
        value: avenrootechnologies@gmail.com
